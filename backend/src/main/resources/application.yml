spring:
  application:
    name: api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    # 쉼표로 여러 개 지정
    allowed-origins: ${WEB_ORIGIN}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
